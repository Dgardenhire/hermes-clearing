description: "The Clearing: a writing room for Hermes Desktop. Write in a quiet page set in Libre Caslon Text inside a scene that follows your light or dark theme. Quick check marks throat-clearing, stacked hedges, filler, stock phrases and long sentences without using your model. Other words shows senses and other words for any word you double-click, from Open English WordNet, also without your model. The Ask line (Cmd/Ctrl+E) finds the right pass in plain words across the editor passes, 9 composition checks, 25 editorial methods and 56 craft techniques, and runs it on your own Hermes model. Every note is pinned to an exact passage of your text and checked against it before you see it; corrections come as change records you keep or skip; suggested rewrites, openings and endings show in your page, and one goes in when you click Use this. Pieces, versions and passes are kept; nothing is deleted outright (past 200 versions of one piece, the oldest pause-saves roll off). Disclosure: editor passes go through Hermes's plugin LLM access to your configured model on the plugin's own auxiliary task clearing_editor (Settings, Models, Auxiliary), only when you start one, sending the piece or selected passage and its title with secrets scrubbed by Hermes's redaction first; registers one observe-only hook, post_auxiliary_call, that ignores every task but clearing_editor and reads only its finish reason, model name and token counts (kept in memory to catch cut-off answers; never prompt or reply text; never changes a call); stores pieces, versions and pass results in <HERMES_HOME>/plugin-data/clearing/clearing.db and preferences plus an unsaved-text buffer in desktop plugin storage; reads only files you pick; writes text exports only into a folder you grant, and builds Word exports in <HERMES_HOME>/plugin-data/clearing/exports for Hermes's save dialog; a web page you bring in is read by Hermes's web tool, and dictation goes to the speech-to-text set up in Hermes (named before anything is sent); no background work, credentials, telemetry or updates. Bundles Libre Caslon Text (SIL OFL 1.1) and Open English WordNet 2025 (CC BY 4.0) with WordNet 3.1 (Princeton license). The Clearing's own code is under the PolyForm Shield License 1.0.0."
