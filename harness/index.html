<!doctype html>
<!--
  The Clearing harness: renders desktop/plugin.js in a browser with a stand-in SDK (sdk.js) and an
  in-page fake backend (harness.js), so each screen can be looked at and screenshotted without Hermes.
  Serve the repo root:  /usr/bin/python3 -m http.server 8794 --bind 127.0.0.1 --directory .
  Then:  http://127.0.0.1:8794/harness/?state=quick&theme=dark
  Theme values approximate Hermes's default (nous) skin; dark is the app's :root.dark class.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Clearing harness</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@vscode/codicons@0.0.45/dist/codicon.css">
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.2.7",
    "react/jsx-runtime": "https://esm.sh/react@19.2.7/jsx-runtime",
    "react-dom/client": "https://esm.sh/react-dom@19.2.7/client?deps=react@19.2.7",
    "@tanstack/react-query": "https://esm.sh/@tanstack/react-query@5.101.2?deps=react@19.2.7",
    "nanostores": "https://esm.sh/nanostores@1.4.2",
    "@nanostores/react": "https://esm.sh/@nanostores/react@1.1.0?deps=react@19.2.7,nanostores@1.4.2",
    "@hermes/plugin-sdk": "./sdk.js"
  }
}
</script>
<style>
:root {
  --ui-base: #1f2328; --ui-text-primary: rgba(31, 35, 40, 0.94); --ui-accent: #0053fd;
  --ui-bg-chrome: #f6f7f9; --ui-bg-sidebar: #eceff3; --ui-bg-editor: #ffffff; --ui-bg-elevated: #ffffff;
  --ui-stroke-secondary: #d6dbe1; --dt-primary: #0053fd; --dt-primary-foreground: #ffffff;
  --radius-scalar: 0.2; --radius-md: calc(var(--radius-scalar) * 0.625rem);
  --font-sans: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
:root.dark {
  --ui-base: #e6edf3; --ui-text-primary: rgba(230, 237, 243, 0.94); --ui-accent: #4a84fe;
  --ui-bg-chrome: #0d0d0e; --ui-bg-sidebar: #0a0a0b; --ui-bg-editor: #0e0f12; --ui-bg-elevated: #17191e;
  --ui-stroke-secondary: #262b33; --dt-primary: #4a84fe; --dt-primary-foreground: #0e0f12; color-scheme: dark;
}
:root.orange { --ui-accent: #d45a00; --dt-primary: #d45a00 } :root.dark.orange { --ui-accent: #ff7a1a; --dt-primary: #ff7a1a }
:root.red { --ui-accent: #cf2d56; --dt-primary: #cf2d56 } :root.dark.red { --ui-accent: #e75e78; --dt-primary: #e75e78 }
:root.green { --ui-accent: #1f8a5b; --dt-primary: #1f8a5b } :root.dark.green { --ui-accent: #55a583; --dt-primary: #55a583 }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--ui-bg-sidebar); color: var(--ui-text-primary); font-family: var(--font-sans); font-size: 14px; -webkit-font-smoothing: antialiased; }
.hb-window { height: 100vh; display: grid; grid-template-columns: 220px 1fr; }
.hb-sidebar { background: var(--ui-bg-sidebar); border-right: 1px solid var(--ui-stroke-secondary); padding: 46px 8px 10px; }
.hb-nav { display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 10px; border-radius: 2px; font-size: 13px; }
.hb-nav-active { background: color-mix(in srgb, var(--ui-accent) 14%, transparent); }
.hb-main { min-width: 0; min-height: 0; position: relative; }
.hb-bare .hb-window { grid-template-columns: 1fr; } .hb-bare .hb-sidebar { display: none; }
#hb-toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 50; }
/* Screenshots catch the settled frame: under load, headless Chrome can capture a card mid fade-in. */
.cl-room * { animation: none !important; }
.hb-toast { max-width: 360px; padding: 10px 12px; border-radius: 2px; background: var(--ui-bg-elevated); border: 1px solid var(--ui-stroke-secondary); font-size: 13px; }
</style>
<link rel="stylesheet" href="./kit-sdk-stub.css">
</head>
<body>
<div class="hb-window">
  <nav class="hb-sidebar"><div class="hb-nav">New chat</div><div class="hb-nav">Sessions</div><div class="hb-nav hb-nav-active">The Clearing</div></nav>
  <main class="hb-main" id="root"></main>
</div>
<div id="hb-toasts"></div>
<script type="module" src="./harness.js"></script>
</body>
</html>
